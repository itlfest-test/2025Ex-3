<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>受験生応援！学園祭ナビ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-main">
      <h1 class="main-title">大学生活を体験しよう！<br>🎪 学園祭 企画ナビ</h1>
      <div id="menu-toggle" class="hamburger-menu">
        <span></span><span></span><span></span>
      </div>
    </div>
    <p class="subtitle">未来のキャンパスを歩く「ストーリー形式」ガイド</p>
  </header>

  <div class="container">
    <section id="search-area" class="card">
      <h2>🏷️ カテゴリから探す</h2>
      <div id="tag-container" class="tag-list">
        </div>
      
      <div class="filter-row">
        <select id="university" class="options"><option value="">大学指定なし</option></select>
        <select id="date-select" class="options">
          <option value="">日程指定なし</option>
          <option value="2025-11-26">11月26日(追加分)</option>
        </select>
      </div>

      <div class="btn-group">
        <button id="searchBtn" class="btn primary-3d">検索</button>
        <button id="clearBtn" class="btn ghost">クリア</button>
      </div>
    </section>

    <section id="results-area">
      <h2>📋 おすすめ行程・イベント一覧</h2>
      <div id="results" class="results-grid"></div>
    </section>

    <section id="favorites-area" class="card hidden">
      <h2>⭐ 当日スケジュール（簡易表）</h2>
      <div class="table-wrapper">
        <table id="schedule-table">
          <thead>
            <tr><th>時間</th><th>企画内容</th><th>場所</th></tr>
          </thead>
          <tbody id="schedule-body">
            </tbody>
        </table>
      </div>
      <hr>
      <h3>🕘 チェックした履歴</h3>
      <div id="fav-history"></div>
    </section>

    <section id="transit-area" class="card hidden">
      <h2>🏃‍♂️ 企画間・教室ルート案内</h2>
      <div class="transit-box">
        <select id="transit-departure" class="options"><option value="">出発教室を選択</option></select>
        <div class="arrow">↓</div>
        <select id="transit-arrival" class="options"><option value="">到着教室を選択</option></select>
        <button onclick="searchTransitRoute()" class="btn primary-3d full-width">最短ルートを表示</button>
      </div>
      <div id="transit-result"></div>
    </section>

    <section id="map-area" class="card hidden">
      <h2>🗺️ 学内マップ（準備中）</h2>
      <div class="map-container">
        <img src="data/map_screenshot.png" alt="マップ準備中" class="placeholder-img">
        <p>※ここに地図のスクショが表示されます</p>
      </div>
    </section>

  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="search"><span>🔍</span><label>探す</label></button>
    <button class="nav-btn" data-view="favorites"><span>⭐</span><label>リスト</label></button>
    <button class="nav-btn" data-view="transit"><span>🏃‍♂️</span><label>移動</label></button>
    <button class="nav-btn" data-view="map"><span>🗺️</span><label>マップ</label></button>
    <button class="nav-btn" data-view="info"><span>ℹ️</span><label>情報</label></button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
